name: Publish X-Cleaner AI images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version in MAJOR.MINOR.PATCH form
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency: x-cleaner-image-publication

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend, standalone]
        host:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.host.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$TARGET" == standalone ]] || image="$image-$TARGET"
          docker buildx build --platform "linux/$ARCH" --target "$TARGET" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:$VERSION-$ARCH" --push .

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          for target in backend frontend standalone; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}"
            [[ "$target" == standalone ]] || image="$image-$target"
            docker buildx imagetools create --tag "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
            docker buildx imagetools inspect "$image:$VERSION"
          done
